name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: No drafts in the repository
        run: node scripts/check-no-drafts.mjs

      - name: Lint
        run: pnpm exec biome ci ./src ./scripts

      - name: Unit tests
        run: pnpm test

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: No JavaScript in the built pages
        run: |
          if grep -rl '<script' --include='*.html' dist; then
            echo "Pages must work without JavaScript." && exit 1
          fi

      - name: Homepage stays light
        run: |
          size=$(wc -c < dist/index.html)
          echo "dist/index.html: $size bytes"
          test "$size" -lt 30720
